name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # Ionic React + Vite web build: npm ci, eslint, tsc, vitest with a coverage gate, vite build.
    # There is no Capacitor native project, so there is no Android/iOS build to run.
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true
      coverage-threshold: "88" # measured 88.32% lines (all of src/) on 2026-10-22, rounded down
      build-command: npm run build
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
